<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tài Xế - Phát Vị Trí</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f5f5f5; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; text-align: center; }
        
        .card {
            background: #fff; padding: 30px 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px;
        }
        
        h1 { color: #d32f2f; font-size: 1.5rem; margin-bottom: 5px; }
        .booking-id { font-size: 1.2rem; font-weight: 700; color: #333; margin-bottom: 20px; padding: 10px; background: #e0e0e0; border-radius: 8px; display: inline-block;}
        
        .status { margin-bottom: 30px; font-size: 1rem; color: #666; }
        
        .btn {
            display: block; width: 100%; padding: 15px; border: none; border-radius: 10px;
            font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s;
            margin-bottom: 15px;
        }
        .btn-start { background: #ffca28; color: #333; }
        .btn-start:active { background: #ffb300; }
        .btn-stop { background: #e0e0e0; color: #333; display: none; }
        
        .pulse-ring {
            width: 80px; height: 80px; background: rgba(211, 47, 47, 0.2); border-radius: 50%;
            display: none; align-items: center; justify-content: center; margin: 0 auto 20px auto;
            animation: pulse 1.5s infinite;
        }
        .pulse-ring i { font-size: 30px; color: #d32f2f; }
        
        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(211, 47, 47, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(211, 47, 47, 0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>NHẬN CUỐC CỨU HỘ</h1>
        <div id="bookingDisplay" class="booking-id">Mã: Đang tải...</div>
        
        <div id="radar" class="pulse-ring">
            <i class="fas fa-location-arrow"></i>
        </div>
        
        <div id="statusText" class="status">Sẵn sàng phát định vị cho khách hàng</div>
        
        <button id="btnStart" class="btn btn-start"><i class="fas fa-play"></i> BẮT ĐẦU CHẠY</button>
        <button id="btnStop" class="btn btn-stop"><i class="fas fa-check"></i> HOÀN THÀNH CUỐC</button>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- App Logic -->
    <script src="js/driver.js"></script>
</body>
</html>
