<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tài Xế - Phát Vị Trí</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f5f5f5; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        
        #map { flex: 1; width: 100%; z-index: 1; }

        .control-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px 20px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            z-index: 1000;
            border-radius: 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .control-panel::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 5px;
            background: #e0e0e0;
            border-radius: 10px;
        }
        
        h1 { color: #d32f2f; font-size: 1.4rem; font-weight: 800; margin-bottom: 5px; letter-spacing: -0.5px; }
        .booking-id { font-size: 0.95rem; font-weight: 600; color: #555; background: #f0f0f0; padding: 5px 12px; border-radius: 12px; display: inline-block; margin-bottom: 10px; }
        
        .status { font-size: 0.95rem; color: #555; margin-bottom: 15px; font-weight: 500; }
        
        .btn {
            width: 100%; padding: 14px; font-size: 1.1rem; font-weight: 700; color: #fff;
            border: none; border-radius: 16px; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        .btn-start { background: linear-gradient(135deg, #ffca28, #ffb300); color: #333; }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 202, 40, 0.4); }
        .btn-nav { background: linear-gradient(135deg, #1e88e5, #1565c0); text-decoration: none; margin-bottom: 10px; }
        .btn-stop { background: linear-gradient(135deg, #43a047, #2e7d32); display: none; }
        .btn-stop:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(46, 125, 50, 0.4); }
        
        .pulse-ring {
            width: 80px; height: 80px; background: rgba(211, 47, 47, 0.2); border-radius: 50%;
            display: none; align-items: center; justify-content: center; margin: 0 auto 20px auto;
            animation: pulse 1.5s infinite;
        }
        .pulse-ring i { font-size: 30px; color: #d32f2f; }
        
        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(211, 47, 47, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(211, 47, 47, 0); }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="control-panel">
        <h1>NHẬN CUỐC CỨU HỘ</h1>
        <div id="bookingDisplay" class="booking-id">Mã: Đang tải...</div>
        
        <div id="customerPhoneDisplay" style="margin: 5px 0 15px 0; font-size: 1.1rem; display: none;">
            SĐT Khách: <a href="#" id="callCustomerBtn" style="color: #d32f2f; font-weight: bold; text-decoration: none; padding: 5px 10px; background: #ffebee; border-radius: 20px;"><i class="fas fa-phone-alt"></i> <span></span></a>
        </div>
        
        <div id="statusText" class="status">Sẵn sàng phát định vị cho khách hàng</div>
        
        <a id="navigateBtn" class="btn btn-nav" href="#" target="_blank" rel="noopener" style="display: none;"><i class="fas fa-route"></i> CHỈ ĐƯỜNG (GOOGLE MAPS)</a>

        <button id="btnStart" class="btn btn-start"><i class="fas fa-play"></i> BẮT ĐẦU CHẠY</button>
        <button id="btnStop" class="btn btn-stop"><i class="fas fa-check"></i> HOÀN THÀNH CUỐC</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- App Logic -->
    <script src="js/driver.js?v=5"></script>
</body>
</html>
