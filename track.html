<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Theo Dõi Xe Cứu Hộ</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { height: 100vh; display: flex; flex-direction: column; }
        
        #map { flex: 1; width: 100%; z-index: 1; }
        
        .status-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px 20px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            z-index: 1000;
            border-radius: 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .status-panel::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 5px;
            background: #e0e0e0;
            border-radius: 10px;
        }
        
        .status-title { font-size: 1.3rem; font-weight: 800; color: #d32f2f; margin-bottom: 5px; letter-spacing: -0.5px; }
        .status-desc { font-size: 0.95rem; color: #555; margin-bottom: 15px; line-height: 1.4; }
        
        .pulse-loader {
            width: 60px; height: 60px;
            background-color: #ffca28;
            border-radius: 100%;
            animation: sk-scaleout 1.2s infinite ease-in-out;
            margin: 0 auto 15px auto;
            box-shadow: 0 0 20px rgba(255, 202, 40, 0.4);
        }
        
        @keyframes sk-scaleout {
            0% { transform: scale(0); }
            100% { transform: scale(1.0); opacity: 0; }
        }
        
        .driver-info {
            background: #fff;
            padding: 15px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            margin-top: 15px;
            border: 1px solid #f4f4f4;
            transition: all 0.3s ease;
        }
        
        .driver-info:hover {
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .driver-icon-wrap {
            width: 45px;
            height: 45px;
            background: #ffebee;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .driver-details { text-align: left; }
        .driver-details strong { display: block; color: #222; font-size: 1.05rem; }
        .driver-details span { font-size: 0.85rem; color: #777; font-weight: 500; }
        
        /* Marker Animation */
        .animated-marker {
            transition: transform 1.5s linear;
        }

        /* Progress Bar */
        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            position: relative;
        }
        .progress-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 15px;
            right: 15px;
            height: 4px;
            background: #e0e0e0;
            z-index: 1;
            transform: translateY(-50%);
        }
        .progress-bar-fill {
            position: absolute;
            top: 50%;
            left: 15px;
            height: 4px;
            background: #ffb300;
            z-index: 2;
            transform: translateY(-50%);
            transition: width 0.5s ease, background 0.5s ease;
            width: 0%;
        }
        .step {
            z-index: 3;
            background: #e0e0e0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.5s ease, box-shadow 0.5s ease;
            box-shadow: 0 0 0 4px #fff;
        }
        .step.active {
            background: #ffb300;
            box-shadow: 0 0 0 4px #fff, 0 0 10px rgba(255, 179, 0, 0.5);
        }
        .step.done {
            background: #43a047;
            box-shadow: 0 0 0 4px #fff, 0 0 10px rgba(67, 160, 71, 0.5);
        }
        .step-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="status-panel">
        <div id="loader" class="pulse-loader"></div>
        <div id="statusTitle" class="status-title">Đang tìm xe cứu hộ...</div>
        <div id="statusDesc" class="status-desc">Hệ thống đang kết nối với tài xế gần nhất. Vui lòng giữ máy.</div>
        
        <div id="progressBlock" style="display: none; padding: 0 10px;">
            <div class="progress-container">
                <div class="progress-bar-fill" id="progressFill"></div>
                <div class="step active" id="step1"><i class="fas fa-check"></i></div>
                <div class="step" id="step2"><i class="fas fa-truck-moving"></i></div>
                <div class="step" id="step3"><i class="fas fa-flag-checkered"></i></div>
            </div>
            <div class="step-labels">
                <span>Đã nhận</span>
                <span>Đang tới</span>
                <span>Hoàn thành</span>
            </div>
        </div>
        
        <div id="driverInfo" class="driver-info" style="display: none; align-items: center; gap: 15px;">
            <div class="driver-icon-wrap">
                <i class="fas fa-truck-pickup" style="font-size: 20px; color: #d32f2f;"></i>
            </div>
            <div class="driver-details" style="flex: 1;">
                <strong>Xe Cứu Hộ Đang Tới</strong>
                <span id="distanceText">Khoảng cách: Đang tính toán...</span>
            </div>
            <a href="tel:19009999" style="background: linear-gradient(135deg, #43a047, #2e7d32); color: #fff; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4); transition: transform 0.2s;"><i class="fas fa-phone-alt" style="font-size: 1.1rem;"></i></a>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- App Logic -->
    <script src="js/track.js"></script>
</body>
</html>
