<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin - Cứu Hộ Giao Thông 123</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f4f7f6; color: #333; }
        
        .header { background: linear-gradient(135deg, #d32f2f, #b71c1c); color: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .header h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.5px; }
        
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        /* Login Overlay */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(244, 247, 246, 0.95); backdrop-filter: blur(10px); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; border: 1px solid rgba(0,0,0,0.05); }
        .login-box h2 { margin-bottom: 25px; color: #d32f2f; font-weight: 800; }
        .login-box input { width: 100%; padding: 14px; margin-bottom: 20px; border: 2px solid #eee; border-radius: 12px; font-size: 1rem; transition: border 0.3s; }
        .login-box input:focus { outline: none; border-color: #d32f2f; }
        .btn { padding: 12px 24px; background: linear-gradient(135deg, #d32f2f, #b71c1c); color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(211, 47, 47, 0.4); }
        .btn-success { background: linear-gradient(135deg, #43a047, #2e7d32); box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3); }
        .btn-success:hover { box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4); }
        .btn-danger { background: #c62828; }
        
        /* Tabs */
        .tabs { display: flex; gap: 12px; margin-bottom: 25px; }
        .tab-btn { padding: 12px 25px; background: #fff; border: 2px solid transparent; border-radius: 12px; font-weight: 600; cursor: pointer; color: #666; transition: all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .tab-btn.active { background: #d32f2f; color: #fff; border-color: #d32f2f; box-shadow: 0 6px 15px rgba(211, 47, 47, 0.3); }
        
        /* Content Panels */
        .panel { display: none; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .panel.active { display: block; }
        
        .panel h3 { margin-bottom: 20px; color: #333; display: flex; justify-content: space-between; align-items: center; }
        
        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f9f9f9; font-weight: 600; color: #555; }
        td .action-btn { background: none; border: none; cursor: pointer; color: #888; font-size: 1.1rem; margin-right: 10px; }
        td .action-btn:hover { color: #d32f2f; }
        td .action-btn.edit:hover { color: #1976d2; }
        
        /* Form inputs for Modals */
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.95rem; color: #444; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 1rem; transition: border 0.3s; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #d32f2f; }
        .form-group textarea { resize: vertical; min-height: 100px; }
        
        .upload-wrapper { display: flex; gap: 10px; align-items: center; }
        .upload-wrapper input[type="file"] { flex: 1; padding: 8px; border: 2px dashed #ddd; background: #fafafa; }
        .upload-wrapper button { padding: 12px 15px; }
        
        /* Modal Override */
        .swal2-html-container { margin: 1em 0 !important; }
        /* Popup phải nằm trên lớp đăng nhập (#loginOverlay z-index 9999), nếu không sẽ bị che */
        .swal2-container { z-index: 10050 !important; }
        div:where(.swal2-container) button:where(.swal2-styled).swal2-confirm { background-color: #d32f2f; }

        /* Nút hiện/ẩn mật khẩu */
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 50px; }
        .toggle-password { position: absolute; top: 0; right: 4px; height: 52px; width: 44px; border: none; background: none; color: #888; cursor: pointer; font-size: 1.05rem; border-radius: 10px; }
        .toggle-password:hover, .toggle-password:focus-visible { color: #d32f2f; outline: none; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2><i class="fas fa-lock"></i> Đăng Nhập Quản Trị</h2>
            <form id="loginForm">
                <input type="email" id="adminEmail" placeholder="Email" autocomplete="username" required>
                <div class="password-wrap">
                    <input type="password" id="adminPassword" placeholder="Mật khẩu" autocomplete="current-password" required>
                    <button type="button" id="togglePassword" class="toggle-password" aria-label="Hiện mật khẩu" aria-pressed="false" title="Hiện mật khẩu">
                        <i class="fas fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
                <button type="submit" id="btnLogin" class="btn" style="width: 100%; justify-content: center;">Đăng Nhập</button>
            </form>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <h1><i class="fas fa-cogs"></i> Quản Trị Cứu Hộ</h1>
        <button class="btn" style="background: rgba(255,255,255,0.2);" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Thoát</button>
    </header>

    <!-- Main Content -->
    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" id="btnTabPricing" onclick="switchTab('pricing')"><i class="fas fa-tags"></i> Bảng Giá</button>
            <button class="tab-btn" id="btnTabSettings" onclick="switchTab('settings')"><i class="fas fa-cog"></i> Cấu Hình Web</button>
        </div>
        
        <!-- Pricing Panel -->
        <div id="pricingPanel" class="panel active">
            <h3>Bảng Giá Dịch Vụ <button class="btn btn-success" onclick="openPricingModal()"><i class="fas fa-plus"></i> Thêm Mới</button></h3>
            <table>
                <thead>
                    <tr>
                        <th>Nhóm</th>
                        <th>Loại Xe</th>
                        <th>Giá Cơ Bản</th>
                        <th>Giá Vượt (km)</th>
                        <th style="width: 100px;">Thao Tác</th>
                    </tr>
                </thead>
                <tbody id="pricingTableBody">
                    <tr><td colspan="5" style="text-align: center;">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
        
        <!-- Settings Panel -->
        <div id="settingsPanel" class="panel">
            <h3>Cấu Hình Giao Diện Trang Chủ <button class="btn btn-success" onclick="saveSettings()"><i class="fas fa-save"></i> Lưu Cấu Hình</button></h3>
            
            <div style="display: grid; gap: 30px; margin-top: 20px;">
                <div class="form-group">
                    <label>Logo Chính (Góc trái trên cùng) — ảnh vuông</label>
                    <div class="upload-wrapper">
                        <img id="previewMainLogo" src="" style="height: 50px; background: #eee; border-radius: 8px; object-fit: contain;">
                        <input type="text" id="setMainLogoUrl" placeholder="Link ảnh hoặc Tải lên..." style="flex: 2;">
                        <input type="file" id="fileMainLogo" accept="image/*">
                        <button class="btn" onclick="uploadFile('fileMainLogo', 'setMainLogoUrl', 'previewMainLogo', 400)"><i class="fas fa-cloud-upload-alt"></i> Tải lên</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Logo Chân Trang (Footer) — ảnh vuông</label>
                    <div class="upload-wrapper">
                        <img id="previewFooterLogo" src="" style="height: 50px; background: #eee; border-radius: 8px; object-fit: contain;">
                        <input type="text" id="setFooterLogoUrl" placeholder="Link ảnh hoặc Tải lên..." style="flex: 2;">
                        <input type="file" id="fileFooterLogo" accept="image/*">
                        <button class="btn" onclick="uploadFile('fileFooterLogo', 'setFooterLogoUrl', 'previewFooterLogo', 400)"><i class="fas fa-cloud-upload-alt"></i> Tải lên</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Ảnh Bìa (Banner ngang đầu trang) — tỉ lệ 2:1, ảnh xe thật</label>
                    <div class="upload-wrapper">
                        <img id="previewBanner" src="" style="height: 50px; background: #eee; border-radius: 8px; object-fit: cover; flex: 1;">
                        <input type="text" id="setBannerUrl" placeholder="Link ảnh hoặc Tải lên..." style="flex: 2;">
                        <input type="file" id="fileBanner" accept="image/*">
                        <button class="btn" onclick="uploadFile('fileBanner', 'setBannerUrl', 'previewBanner', 1600)"><i class="fas fa-cloud-upload-alt"></i> Tải lên</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="js/admin.js?v=5"></script>
</body>
</html>
